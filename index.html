    <title>جلسه 7 - css-grid-project</title>
    <style>
      .container {
        max-width: 960px;
        margin: 0 auto;
        display: grid;
        grid-gap: 20px;
        grid-template-columns: auto auto auto auto;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(10, 1fr);
      }
      .container div {
        overflow: hidden;
        
      }
      .container div img{
        transition: .5s ease;
      }
      .container div img:hover {
        transform: rotate(10deg) scale(1.4);
      }
      .c1 {
        /* grid-column: 1/3;
        grid-row: 1/3; */
        grid-area: 1/1/3/3;
      }
      .c7 {
        grid-column: 2/4;
        grid-row: 3/5;
      }
      .c13{
        grid-column:3/span 2 ;
        grid-row: 5/span 2;
      }
      .c17{
        grid-column: 1/ 3;
        grid-row: 7/9;
      }
      .c21{
        grid-column: 1/3;
        grid-row: 9/11;
      }
      .c22{
        grid-column: 3/5;
        grid-row: 9/11;
      }
      .img-responsive{
        width: 100%;
        height: auto;
        display: block;
      }
      @media screen and (max-width: 600px){
        .c2 {
        /* grid-column: 1/3;
        grid-row: 1/3; */
        grid-area: 1/3/3/5;
      }
      }
    </style>
  </head>
